#   → i=3..6 照片幕（AnHeYu featured 式）→ i=7 Hi 联系幕（左中间，最后一页）
secs:
  - i: 0
    title: |
      Welcome To
      Shang Qian's Home
  - i: 1
    label: MESSAGE
    text: 你好阿，我是尚谦，一个怀揣着诗与远方的 Data Analyst。
    quote_from: 加缪《夏天集》
    quote: 在隆冬，我终于知道，我身上有一个不可战胜的夏天。
  # 2026-09-29 按要求改：主标题换成自拟对句（嵌「尚」「谦」二字），
  #   副标题取刘过《唐多令·芦叶满汀洲》「欲买桂花同载酒，终不似，少年游。」
  #   （与本页的怀旧 / 少年气正好对位）。
  #   旧版（保留备选）：
  #     head: 走得很慢的人，看得最清楚。
  #     sub: 写字、读旧书、听雨声。雨声是唯一能让我立刻平静下来的声音。
  #   对位：第二、三幕为「右中间」（纵向居中不变，横向靠右）。
  - i: 2
    head: 尚思少年事，谦然看星辰。
    sub: 欲买桂花同载酒，终不似，少年游。

# ---- 第四~七幕（v6 · 2026-09-29 新增；v6b 由 i=4..7 顺移到 i=3..6）---- 照片幕
#   形态参照 AnHeYu 个人主页的 featured 幕（他的第四~七页）：
#   深色底上一张**大圆角照片卡片**（不铺满整屏，四周留出极夜底色）+
#   压在卡片右下角并向外探出的黑色标签盒（主标题 + 副标题 + 箭头装饰）。
#   · 标签逐行用 split-line 遮罩滑出揭示（参考站同款动效，见 clouds.css）；
#   · 按要求**不含任何超链接**（photo 幕里不渲染 <a>）；
#   · 图片在 themes/liushen-clone/source/img/profile/，
#     均为原字节直拷（源图已是 1920 长边 / 161~436KB 的 Web 友好 JPEG，
#     二次压缩只会损画质、省不了多少体积，故不动）。
#   · 背景过渡设计（为什么照片幕不会破坏极光场景）见 clouds.js
#     「v6 照片幕的背景策略」段：相机只做缓慢漂移 + 极光随覆盖率收敛。
