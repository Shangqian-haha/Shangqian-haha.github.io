  #   2026-09-29 二改：文案不再照搬参考站，换成自己的口径；
  #   本幕对位从「居中」改为「左中间」；
  #   第二、三幕则是「右中间」（本幕仍靠左）。
  #   标题 / desc 备选：
  #     标题：① Look for me😃　② 在极光下等我
  #     desc：① 雪会停，夜会亮，我们总会遇见。
  #           ② 山高水远，慢慢走，总会遇见。
  #   旧版（保留备选）：
  #     head: 星在头上，冰在脚下。
  #     links: [{label: 读文章, href: /posts/, style: solid},
  #             {label: 关于我, href: /about/, style: ghost}]
