# ---- 第五~八幕（v6 · 2026-09-29 新增）：照片幕 ----
#   形态参照 AnHeYu 个人主页的 featured 幕（他的第四~七页）：
#   整屏照片 + 右下角标签（主标题 + 副标题 + 箭头装饰）。
#   · 标签逐行用 split-line 遮罩滑出揭示（参考站同款动效，见 clouds.css）；
#   · 按要求**不含任何超链接**（photo 幕里不渲染 <a>）；
#   · 对位：右下角（横向靠右 + 纵向靠底），与二、三幕的「右中间」区分；
#   · 图片在 themes/liushen-clone/source/img/profile/，
#     均为原字节直拷（源图已是 1920 长边 / 161~436KB 的 Web 友好 JPEG，
#     二次压缩只会损画质、省不了多少体积，故不动）。
#   · 背景过渡设计（为什么照片幕不会破坏极光场景）见 clouds.js
#     「v6 照片幕的背景策略」段：相机只做缓慢漂移 + 极光随覆盖率收敛
#     + 照片幕完全盖住时画布隔帧渲染。
  - i: 4
    photo:
      src: /img/profile/photo-guidian.jpg
      alt: 桂电的黄昏，橘色天光落在水面上
      title: 桂电的天空很美。
      sub: 那是一段短暂而小有遗憾的时光。
  - i: 5
    photo:
      src: /img/profile/photo-jingdezhen.jpg
      alt: 木墙上挂着景德镇书法，一只猫仰头望
      title: 景德镇。
      sub: 你也为景德镇着迷吗小猫咪。
  - i: 6
    photo:
      src: /img/profile/photo-guilin.jpg
      alt: 桂林山水，晚霞与山影倒映在湖面
      title: 桂林山水甲天下。
      sub: 玉碧罗青意可参。
  - i: 7
    photo:
      src: /img/profile/photo-rivernight.jpg
