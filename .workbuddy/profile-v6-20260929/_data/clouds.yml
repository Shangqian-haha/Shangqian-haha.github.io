# ---- 入场闸门 ----
gate:
  loading: 正在生成极光
  enter: 点击任意处进入

# ---- 滚动引导（左下竖排）----
guide: 滚动查看更多

# ---- 四幕滚动叙事 ----
secs:
  - i: 0
    title: |
      Welcome To
      Shang Qian's Home
  - i: 1
    label: MESSAGE
    text: 你好阿，我是尚谦，一个怀揣着诗与远方的 Data Analyst。
    quote_from: 加缪《夏天集》
    quote: 在隆冬，我终于知道，我身上有一个不可战胜的夏天。
  # 2026-09-29 按要求改：主标题换成自拟对句（嵌「尚」「谦」二字），
  #   副标题取刘过《唐多令·芦叶满汀洲》「欲买桂花同载酒，终不似，少年游。」
  #   （与本页的怀旧 / 少年气正好对位）。
  #   旧版（保留备选）：
  #     head: 走得很慢的人，看得最清楚。
  #     sub: 写字、读旧书、听雨声。雨声是唯一能让我立刻平静下来的声音。
  #   对位：第二、三幕为「右中间」（纵向居中不变，横向靠右）。
  - i: 2
    head: 尚思少年事，谦然看星辰。
    sub: 欲买桂花同载酒，终不似，少年游。
  # 第四幕（末幕）：形态参照 AnHeYu 个人主页的联系幕
  #   （大标题 + 一句 desc + 左侧一道竖线挑起的联系条目列，
