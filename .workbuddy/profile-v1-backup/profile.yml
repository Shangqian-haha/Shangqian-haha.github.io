# ==============================================
# 个人主页 · 内容数据
# 氛围定位：阴雨白天的威斯敏斯特桥（Westminster Bridge）
#           —— 灰蓝色的天空、湿漉漉的桥面、撑着伞走过的人
#           克制、安静、克制的暖（唯一暖色是大本钟的表盘）
# 全部文案可自由修改；留空则自动用页面里的兜底默认值
# ==============================================

# ---- 顶部信息条（左侧竖排 / 右侧导航） ----
brand: 尚谦
brand_sub: Shang Qian

# ---- 第一幕 · 英雄区 ----
# 这里是「未进入」时的封面：只有一段题词 + 一个提示
# 题词取自已故诗人张枣的《镜中》，是中国当代诗里写"未发生之事"最克制的一句。
# 用它是因为：雨天最像"后悔/如果"的时刻，而句子本身没有提雨，
# 留白反而更配这幅灰蓝色的伦敦 —— 比直白写雨高级。
hero:
  overline: LONDON · BRIDGE · RAIN
  title: 只要想起一生中后悔的事
  title2: 梅花便落了下来
  desc: |
    —— 张枣《镜中》
  enter_text: 轻触进入
  gesture_text: TAP ANYWHERE TO BEGIN

# ---- 第二幕 · 自述 ----
story:
  label: MESSAGE
  title: 你好，我是尚谦
  paragraphs:
    - 一个在夜里写字的人。
    - 喜欢雨声、旧书、和一杯放凉了的咖啡。
    - |
      不太擅长热闹的场合，但在安静里能待很久。
      这里没有多少东西，只有一些我认真想过的话。
    - |
      如果你也喜欢下雨天，那我们大概是同一种人。

# ---- 第三幕 · 关于 ----
about:
  label: ABOUT
  title: 你不知道的，关于我的几件事
  subtitle: 一些不成体系的碎片
  items:
    - icon: moon
      title: 深夜
      desc: 一天里最喜欢的时间。安静到能听见自己的呼吸。
    - icon: rain
      title: 雨天
      desc: 雨声是唯一能让我立刻平静下来的声音。
    - icon: coffee
      title: 手冲
      desc: 不追求标准，只是喜欢那个等待的过程。
    - icon: book
      title: 重读
      desc: 好书不怕读第二遍。每次都会读到不一样的自己。

# ---- 第四幕 · 精选（这里的卡片是你的精神坐标） ----
# 每项：title / desc / tag / color(可选 #hex) / image(可选，留空则用纯色卡)
# ⚠️ 配色与伦敦场景对齐：冷灰蓝（默认），只有一处保留暖色（"最后一盏灯"）
featured:
  title: 那些我常去的地方
  desc: 一些让我觉得世界还不错的角落
  items:
    - title: 深夜的厨房
      desc: 凌晨一点，煮一碗面。那一刻世界只有我和水汽。
      tag: 独处
      color: "#1C2530"
    - title: 旧书店的第三排
      desc: 有一本书我找了三年，最后在落灰的角落里遇到它。
      tag: 偶然
      color: "#232A36"
    - title: 雨天的窗边
      desc: 不打伞，就坐着。看雨水把玻璃变成一幅画。
      tag: 停留
      color: "#1A2129"
    - title: 凌晨的最后一盏灯
      desc: 整条街都睡了，只有那一扇窗还亮着。
      tag: 陪伴
      color: "#2E2A22"

# ---- 第五幕 · 联系 ----
contact:
  title: 找我聊聊
  desc: 如果你想说说最近的天气，或者别的什么
  links:
    - label: 邮箱
      value: 357425252@qq.com
      href: "mailto:357425252@qq.com"
    - label: GitHub
      value: github.com/Shangqian-haha
      href: "https://github.com/Shangqian-haha"
    - label: 博客
      value: 回到文章
      href: "/posts/"
  footer: |
    世界在下雨。
    而我们有屋檐。

# ---- 音乐（占位方案） ----
# ⚠️ 当前使用「静音占位」：不加载任何音频文件，但播放/暂停、竖条动画、
#    点击解锁手势等全部交互逻辑真实可用，视觉反馈完整。
# 替换方式：把 src 填成你自己的音频地址即可，其余代码无需改动。
#
# 前台 UI 只有一个圆钮 + 内嵌 canvas 画的 7 根跳动竖条（无音量滑块）。
# 音量在这里配置即可。
music:
  enabled: true
  # 留空 = 占位模式（静音，但交互全部可用）
  # 填入音频 URL 即可真正播放，例如：
  #   src: /music/rain.mp3
  #   src: https://your-cdn.com/ambient.ogg
  src: ""
  # 音频格式（占位模式下忽略）
  type: "audio/mpeg"
  # 曲名只用于无障碍提示（title 属性），前台不再显示文字
  title: Rain on the Window
  # 初始音量 0~1
  volume: 0.35
  loop: true
